<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedAssist – AI Prescription & Lab Report Assistant</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--brand:#2563eb;--ok:#12805c;--okbg:#e3f6ee;--warn:#b54708;--warnbg:#fff3e0;--bad:#b42318;--badbg:#fde8e6;--gx:clamp(16px,4vw,64px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--brand);color:#fff;padding:10px var(--gx);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0}
header h1{margin:0;font-size:20px}header span{font-size:13px;opacity:.85}
.pbtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.pbtn:hover{background:rgba(255,255,255,.3)}
.notice{background:var(--warnbg);color:var(--warn);padding:5px var(--gx);font-size:12.5px;border-bottom:1px solid #f5d9b0;flex-shrink:0}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);gap:14px;padding:14px var(--gx);width:100%;max-width:1560px;margin:0 auto}
.left{overflow-y:auto;min-height:0;padding-right:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2,h3{margin:0 0 8px}h3{font-size:15px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.drop{display:block;border:2px dashed #b8c4d9;border-radius:10px;padding:22px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.over,.drop:hover{border-color:var(--brand);background:#eef4ff}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);margin:0;padding:4px 10px;font-size:12px}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line);margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.step{font-size:12px;padding:4px 10px;border-radius:99px;background:#eef0f4;color:var(--muted)}
.step.active{background:#dbe8ff;color:var(--brand);animation:pulse 1.1s infinite}.step.done{background:var(--okbg);color:var(--ok)}
@keyframes pulse{50%{opacity:.45}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #b8c9f5;border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
.sk{height:14px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,#eceff4 25%,#f7f8fa 50%,#eceff4 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:#eef0f4;color:var(--muted)}
.badge.ai,.badge.normal{background:var(--okbg);color:var(--ok)}.badge.basic,.badge.low{background:var(--warnbg);color:var(--warn)}.badge.high{background:var(--badbg);color:var(--bad)}
.big{font-size:18px;font-weight:600;margin:0 0 6px}
.med{border-left:3px solid var(--brand);padding:4px 10px;margin:8px 0;background:#f8faff;border-radius:0 8px 8px 0}.med p{margin:2px 0 0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.good{border-top:3px solid var(--ok)}.bad{border-top:3px solid var(--bad)}ul{margin:0;padding-left:18px;font-size:14px}li{margin:3px 0}
.alert{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px;font-size:13px;margin-bottom:12px;word-break:break-word}
.err{background:var(--badbg);color:var(--bad)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}
/* Chat fills the column height, so the input box is always visible */
.chat{display:flex;flex-direction:column;min-height:0;height:100%;margin:0;padding:14px}
.chat h2{font-size:18px;flex-shrink:0}
.ctx{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;margin-bottom:8px;padding:6px 10px;border-radius:8px;background:#eef4ff;color:var(--brand);flex-shrink:0}
#msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{max-width:92%;padding:8px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--brand);color:#fff}.msg.bot{align-self:flex-start;background:#eef0f4}.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#98a2b3;animation:pulse 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;flex-shrink:0}.chip{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:#fff;cursor:pointer}
.row{display:flex;gap:8px;flex-shrink:0}.row input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}.row .btn{margin:0}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;flex-shrink:0}
/* Profile modal */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:#fff;border-radius:12px;padding:18px;width:min(540px,100%);max-height:92vh;overflow:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.fg label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}.fg .full{grid-column:1/-1}
.fg input,.fg select{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink);background:#fff}
.mrow{display:flex;gap:8px;align-items:center;justify-content:flex-end}.mrow .muted{margin-right:auto}.mrow .btn{margin:0}
@media(max-width:900px){
 html,body{height:auto}body{display:block;overflow:auto}main{display:block;padding:12px var(--gx)}
 .left{overflow:visible;padding:0}.chat{height:80vh;height:80dvh;margin-top:14px}.fg{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div><h1>🩺 MedAssist</h1><span>AI Prescription &amp; Lab Report Assistant</span></div>
  <button class="pbtn" id="profBtn">👤 <span id="pname">Edit profile</span></button>
</header>
<div class="notice">⚠️ Educational tool only – not medical advice. Consult a doctor before changing any medicine.</div>

<main>
<div class="left">
  <section class="card">
    <div class="tabs">
      <button class="tab active" data-type="prescription">💊 Upload Prescription</button>
      <button class="tab" data-type="lab_report">🧪 Upload Lab Report</button>
    </div>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*,.pdf" hidden>
      <div id="dropText"></div>
    </label>
    <button class="btn" id="go" disabled>Analyze</button>
    <div class="steps hidden" id="steps">
      <span class="step">1 · Uploading</span><span class="step">2 · Scanning text (OCR)</span><span class="step">3 · AI analysis</span><span class="step">4 · Done</span>
    </div>
  </section>
  <section id="result"></section>
</div>

<aside class="card chat">
  <h2>💬 Health Assistant</h2>
  <div class="ctx"><span id="ctxText"></span><button class="btn ghost hidden" id="clearDoc">Clear document</button></div>
  <div id="msgs"></div>
  <div class="chips" id="chips"></div>
  <div class="row"><input id="q" placeholder="Type your question…" maxlength="2000"><button class="btn" id="send">Send</button></div>
</aside>
</main>

<div class="modal hidden" id="modal"><div class="mbox">
  <h2>👤 Edit profile</h2>
  <div class="fg">
    <label>Full name<input id="pf_full_name" maxlength="100"></label>
    <label>Age<input id="pf_age" type="number" min="0" max="120"></label>
    <label>Gender<select id="pf_gender"><option value="">–</option><option>Male</option><option>Female</option><option>Other</option></select></label>
    <label>Blood group<select id="pf_blood_group"></select></label>
    <label>Contact number<input id="pf_phone" type="tel" maxlength="20" placeholder="+91 98765 43210"></label>
    <label>Email<input id="pf_email" type="email" maxlength="120"></label>
    <label class="full">Allergies<input id="pf_allergies" maxlength="500" placeholder="e.g. penicillin, dust"></label>
    <label class="full">Existing conditions<input id="pf_conditions" maxlength="500" placeholder="e.g. diabetes, asthma"></label>
  </div>
  <div class="mrow"><span class="muted" id="pmsg"></span><button class="btn light" id="pcancel">Cancel</button><button class="btn" id="psave">Save changes</button></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const API = /:8000$/.test(location.host) ? "" : "http://127.0.0.1:8000";   // works even if opened from Live Server
const LABEL = {prescription: "prescription", lab_report: "lab report"};

/* ---- Separate state for each tab: file, results, steps, chat ---- */
const mk = () => ({file: null, busy: false, step: null, html: "", docId: null});
const S = {prescription: mk(), lab_report: mk()};
let type = "prescription", token = localStorage.getItem("ma_token");

/* ---- API helper: guest session is created automatically ---- */
async function api(path, opts = {}, retry = true) {
  if (!token) {
    const r = await fetch(API + "/api/session", {method: "POST"});
    token = (await r.json()).session_token; localStorage.setItem("ma_token", token);
  }
  opts.headers = {...(opts.headers || {}), "X-Session-Token": token};
  const r = await fetch(API + path, opts);
  if (r.status === 401 && retry) { token = null; localStorage.removeItem("ma_token"); return api(path, opts, false); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = data.detail;
    throw new Error(Array.isArray(d) ? d.map(x => x.msg).join("; ") : (d || "Request failed"));
  }
  return data;
}

/* ---- Text helpers for chat: one clean disclaimer, **bold**, bullets ---- */
const DISC = /\s*(?:⚠️?\s*)?This is AI-generated educational information, not medical advice\.\s*Always consult a certified doctor before starting, stopping or changing any medicine\.?/gi;
const clean = t => t.replace(DISC, "").replace(/[^.\n]*health-education assistant, not a doctor\.?/gi, "").replace(/\n{3,}/g, "\n\n").trim();
const fmt = t => esc(t).replace(/^[ \t]*[*-][ \t]+/gm, "• ").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

/* ---- Tabs ---- */
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {type = b.dataset.type; renderTab();});
const setSteps = n => document.querySelectorAll(".step").forEach((el, i) =>
  el.className = "step" + (n === null ? "" : i < n ? " done" : i === n ? " active" : ""));

function renderTab() {
  const s = S[type], f = s.file;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.type === type));
  $("#dropText").innerHTML = f ? `✅ <b>${esc(f.name)}</b><br><small>${(f.size / 1024).toFixed(0)} KB – click to change</small>`
                               : "📁 Click or drag &amp; drop a file here<br><small>JPG, PNG or PDF · max 10 MB</small>";
  $("#go").disabled = !f || s.busy;
  $("#go").innerHTML = s.busy ? '<span class="spin"></span>Working…' : "Analyze";
  $("#steps").classList.toggle("hidden", s.step === null); setSteps(s.step);
  $("#result").innerHTML = s.html;
  drawChat();
}

/* ---- Upload ---- */
const fileEl = $("#file"), drop = $("#drop");
const pick = f => {S[type].file = f || null; renderTab();};
fileEl.onchange = () => {pick(fileEl.files[0]); fileEl.value = "";};
["dragover", "dragenter"].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.add("over");}));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.remove("over");}));
drop.addEventListener("drop", ev => pick(ev.dataTransfer.files[0]));

const skeleton = () => `<div class="card"><div class="sk" style="width:35%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div>
  <div class="card"><div class="sk" style="width:25%"></div><div class="sk"></div><div class="sk" style="width:90%"></div><div class="sk" style="width:70%"></div></div>`;
function goStep(t, n) {const s = S[t]; if (s.busy) {s.step = n; if (type === t) setSteps(n);}}

$("#go").onclick = async () => {
  const t = type, s = S[t]; if (!s.file || s.busy) return;
  s.busy = true; s.step = 0; s.html = skeleton(); renderTab();
  const t1 = setTimeout(() => goStep(t, 1), 900), t2 = setTimeout(() => goStep(t, 2), 2400);
  try {
    const fd = new FormData(); fd.append("file", s.file);
    const res = await api(t === "prescription" ? "/api/upload-prescription" : "/api/upload-lab-report", {method: "POST", body: fd});
    s.step = 4; s.html = build(res); s.docId = res.document_id;
    chat.detached = false;
  } catch (e) {
    s.step = null; s.html = `<div class="alert err">❌ ${esc(e.message)}</div>`;
  } finally {
    clearTimeout(t1); clearTimeout(t2); s.busy = false;
    if (type === t) renderTab();
  }
};

/* ---- Results ---- */
const ul = a => (a && a.length) ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="muted">Nothing specific noted.</p>`;
const box = (title, a, cls = "") => `<div class="card ${cls}"><h3>${title}</h3>${ul(a)}</div>`;

function build(r) {
  const a = r.analysis, ai = r.analysis_source === "llm";
  let h = `<div class="card"><div class="badges">
      <span class="badge ${ai ? "ai" : "basic"}">${ai ? "🤖 AI analysis" : "⚙️ Basic mode (no AI)"}</span>
      <span class="badge">OCR: ${esc(r.ocr.engine)} · ${r.ocr.confidence}%</span>
      ${r.ocr.used_vision_fallback ? '<span class="badge">👁️ Image sent to AI</span>' : ""}
      <span class="badge">⏱ ${(r.timings_ms.total / 1000).toFixed(1)}s</span></div>`;
  if (r.ai_error) h += `<div class="alert">AI could not be used, so these are basic results.<br><small>Reason: ${esc(r.ai_error)}</small>${/429|RateLimit/.test(r.ai_error) ? "<br><b>Free-tier limit reached – wait ~1 minute and try again.</b>" : ""}</div>`;
  if (r.doc_type === "prescription") {
    h += `<p class="muted">Probable condition</p><p class="big">${esc(a.condition)}</p><p>${esc(a.summary)}</p></div>
      <div class="card"><h3>💊 Medicines</h3>${(a.medicines || []).map(m => `<div class="med"><b>${esc(m.name)}</b>
        <small class="muted"> ${esc([m.dosage, m.frequency].filter(Boolean).join(" · "))}</small><p>${esc(m.purpose)}</p></div>`).join("") || '<p class="muted">No medicines detected. Try a clearer photo.</p>'}</div>
      <div class="grid2">${box("✅ Do's", a.dos, "good")}${box("❌ Don'ts", a.donts, "bad")}</div>
      ${(a.diet_lifestyle || []).length ? box("🥗 Diet &amp; lifestyle", a.diet_lifestyle) : ""}
      ${(a.prevention || []).length ? box("🛡️ Prevention", a.prevention) : ""}`;
  } else {
    const rows = (a.parameters || []).map(p => { const s = ["low", "high", "normal"].includes(String(p.status).toLowerCase()) ? String(p.status).toLowerCase() : "normal";
      return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.value)} ${esc(p.unit)}</td><td>${esc(p.reference_range)}</td>
        <td><span class="badge ${s}">${s.toUpperCase()}</span></td><td>${esc(p.explanation)}</td></tr>`; }).join("");
    h += `<p class="big">Lab report summary</p><p>${esc(a.summary)}</p></div>
      <div class="card"><h3>🧪 Test results</h3><div class="tw">${rows ? `<table><tr><th>Test</th><th>Value</th><th>Normal range</th><th>Status</th><th>What it means</th></tr>${rows}</table>` : '<p class="muted">No test values could be read.</p>'}</div></div>
      <div class="grid2">${box("✅ Do's", a.dos, "good")}${box("❌ Don'ts", a.donts, "bad")}</div>
      ${(a.diet_lifestyle || []).length ? box("🥗 Diet &amp; lifestyle", a.diet_lifestyle) : ""}
      ${(a.follow_up || []).length ? box("📅 Follow-up", a.follow_up) : ""}`;
  }
  return h;
}

/* ---- Chat: ONE conversation that knows every uploaded document ---- */
let currentUserName = "";
const getGreeting = () => currentUserName 
  ? `Hello ${currentUserName}, what are you looking for? What health prescription or report can I help you with today?`
  : "Hi! Ask me any health question, or upload a prescription or lab report and I'll answer questions about it.";

const chat = {msgs: [{r: "bot", t: getGreeting()}], typing: false, detached: false, ctx: ""};
const TYPES = ["prescription", "lab_report"];
const docsNow = () => chat.detached ? [] : TYPES.filter(t => S[t].docId);   // documents the assistant can see
const names = ts => ts.map(t => LABEL[t]).join(" + ");

function drawChat() {
  const ts = docsNow(), key = ts.join(",");
  if (key !== chat.ctx) {                                          // documents changed (upload / re-attach)
    if (ts.length) chat.msgs.push({r: "sys", t: `Now chatting about your ${names(ts)}.`});
    chat.ctx = key;
  }
  $("#ctxText").textContent = ts.length ? `📎 Chatting about your ${names(ts)}` : "💬 General health chat";
  const btn = $("#clearDoc"), have = TYPES.some(t => S[t].docId);
  btn.classList.toggle("hidden", !ts.length && !(chat.detached && have));
  btn.textContent = ts.length ? "Clear document" : "Use my documents";
  const qs = ts.length === 2 ? ["Summarize both for me", "What should I do next?", "Any diet tips?"]
    : ts[0] === "prescription" ? ["What is each medicine for?", "What should I avoid?", "Any diet tips?"]
    : ts[0] === "lab_report" ? ["Which values are abnormal?", "What should I do next?", "Any diet tips?"]
    : ["How can I sleep better?", "Tips to boost immunity?"];
  $("#chips").innerHTML = qs.map(q => `<button class="chip">${esc(q)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {$("#q").value = c.textContent; sendMsg();});
  $("#msgs").innerHTML = chat.msgs.map(m => `<div class="msg ${m.r}">${m.r === "user" ? esc(m.t) : fmt(m.t)}</div>`).join("")
    + (chat.typing ? '<div class="msg bot"><span class="dots"><span></span><span></span><span></span></span></div>' : "");
  $("#msgs").scrollTop = 1e9;
}
async function sendMsg() {
  const text = $("#q").value.trim(); if (!text || chat.typing) return;
  const ts = docsNow();
  // earlier turns (without notes, greeting or errors) so the assistant remembers and doesn't repeat itself
  const history = chat.msgs.filter(m => m.r !== "sys" && m.t !== getGreeting() && !m.t.startsWith("⚠️")).slice(-8)
    .map(m => ({role: m.r === "user" ? "user" : "assistant", content: m.t}));
  $("#q").value = ""; chat.msgs.push({r: "user", t: text}); chat.typing = true; drawChat();
  try {
    const r = await api("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, document_ids: ts.map(t => S[t].docId), history})});
    chat.msgs.push({r: "bot", t: clean(r.reply)});
  } catch (e) { chat.msgs.push({r: "bot", t: "⚠️ " + e.message}); }
  chat.typing = false; drawChat(); $("#q").focus();
}
$("#send").onclick = sendMsg;
$("#q").addEventListener("keydown", e => {if (e.key === "Enter") sendMsg();});
$("#clearDoc").onclick = () => {
  if (docsNow().length) {chat.msgs = [{r: "bot", t: getGreeting()}]; chat.detached = true; chat.ctx = "";}   // clear chat + detach documents
  else chat.detached = false;                                                                      // "Use my documents"
  drawChat();
};

/* ---- Profile (saved in MySQL through /api/profile) ---- */
const PF = ["full_name", "age", "gender", "blood_group", "phone", "email", "allergies", "conditions"];
$("#pf_blood_group").innerHTML = '<option value="">–</option>' + ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"].map(b => `<option>${b}</option>`).join("");
async function loadProfile() {
  try {
    const p = await api("/api/profile");
    PF.forEach(k => $("#pf_" + k).value = p[k] ?? "");
    if (p.full_name && p.full_name.trim()) {
      currentUserName = p.full_name.trim().split(" ")[0];
      $("#pname").textContent = currentUserName;
    } else {
      currentUserName = "";
      $("#pname").textContent = "Edit profile";
    }

    // If chat only has the initial greeting, update it with the user's name
    if (chat.msgs.length === 1 && chat.msgs[0].r === "bot") {
      chat.msgs[0].t = getGreeting();
      drawChat();
    }
  } catch (e) {}
}
$("#profBtn").onclick = () => {$("#pmsg").textContent = ""; $("#modal").classList.remove("hidden");};
$("#pcancel").onclick = () => $("#modal").classList.add("hidden");
$("#psave").onclick = async () => {
  const d = {}; PF.forEach(k => {const v = $("#pf_" + k).value.trim(); d[k] = v === "" ? null : (k === "age" ? Number(v) : v);});
  $("#pmsg").textContent = "Saving…";
  try {
    await api("/api/profile", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(d)});
    $("#pmsg").textContent = "✅ Saved"; loadProfile();
    setTimeout(() => $("#modal").classList.add("hidden"), 700);
  } catch (e) { $("#pmsg").textContent = "❌ " + e.message; }
};

renderTab(); loadProfile();
</script>
</body>
